name: mono-interp (1단계 검증)

# 게임과 같은 커밋의 Unity Mono를 빌드하고, JIT 권한이 없는 프로세스에서
# MONO_AOT_MODE_INTERP(인터프리터 + AOT 트램폴린)로 돌아가는지 검증한다.
# 게임 파일은 쓰지 않는다 (오픈소스 Mono + 테스트 코드만).

on:
  workflow_dispatch:
  push:
    paths:
      - ci/build-mono.sh
      - ci/test-interp.sh
      - ci/build-aot-ios.sh
      - tests/interp/**
      - .github/workflows/mono-interp.yml

env:
  MONO_REPO: Unity-Technologies/mono
  MONO_COMMIT: 9d7c9afd266e523029fb0cab48e944e528e61e68   # 게임 v3.4.0 libmonobdwgc 의 explicit/9d7c9afd

jobs:
  interp:
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: 빌드 캐시 (복원)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: build/mono-prefix
          key: unity-mono-${{ env.MONO_COMMIT }}-${{ hashFiles('ci/build-mono.sh') }}

      - name: 도구 설치
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          brew install pkg-config cmake mono || true
          # Unity build.pl 과 같은 autotools 버전 (autoconf 2.69 / automake 1.16.1 / libtool 2.4.6) 을 소스에서
          T=$HOME/autotools; mkdir -p $T/src; echo "$T/bin" >> $GITHUB_PATH; export PATH=$T/bin:$PATH
          for pkg in autoconf/autoconf-2.69 automake/automake-1.16.1 libtool/libtool-2.4.6; do
            n=${pkg#*/}
            curl -fsSL https://ftpmirror.gnu.org/gnu/$pkg.tar.gz -o $T/src/$n.tar.gz || curl -fsSL https://ftp.gnu.org/gnu/$pkg.tar.gz -o $T/src/$n.tar.gz
            tar -xzf $T/src/$n.tar.gz -C $T/src
            (cd $T/src/$n && ./configure -q --prefix=$T >/dev/null && make -s -j4 >/dev/null && make -s install >/dev/null)
          done
          which mcs autoconf automake libtoolize cmake
          autoconf --version | head -1; automake --version | head -1; libtoolize --version | head -1

      - name: Unity Mono 소스 (게임과 같은 커밋)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git init -q mono-src && cd mono-src
          git remote add origin https://github.com/$MONO_REPO.git
          git fetch -q --depth 1 origin $MONO_COMMIT
          git checkout -q FETCH_HEAD
          # 게임 런타임의 FULL_VERSION 은 "explicit/9d7c9afd" (8자리). AOT 이미지 runtime_version 이 일치해야 하므로 맞춘다.
          git config core.abbrev 8
          git log -n1 --pretty=format:%h; echo
          # 빌드에 필요 없는 큰 서브모듈 제외 (llvm, boringssl, 테스트 바이너리)
          skip="external/llvm-project external/boringssl external/helix-binaries external/illinker-test-assets external/xunit-binaries external/bockbuild"
          for p in $(git config -f .gitmodules --get-regexp 'submodule\..*\.path' | awk '{print $2}'); do
            case " $skip " in *" $p "*) continue;; esac
            git submodule update --init --depth 1 -- "$p" || git submodule update --init -- "$p"
          done
          git submodule status

      - name: Mono 빌드
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash ci/build-mono.sh mono-src build/mono-prefix 2>&1 | tee build-mono.log | grep -E '^>>>|error:|Error |\*\*\*' || true; test -x build/mono-prefix/bin/mono

      - name: 빌드 캐시 (저장; 뒤 단계가 실패해도 Mono 를 다시 빌드하지 않도록)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/mono-prefix
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: 빌드 로그 (실패 시)
        if: failure()
        run: tail -200 build-mono.log || true

      - name: 인터프리터 검증
        run: bash ci/test-interp.sh build/mono-prefix build/interp-test

      - name: iOS 용 mscorlib AOT 이미지 (libADOFAIAot.dylib)
        run: bash ci/build-aot-ios.sh build/mono-prefix build/mono-aot-ios

      - uses: actions/upload-artifact@v4
        with:
          name: mono-aot-ios
          path: build/mono-aot-ios/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interp-test
          path: |
            build/interp-test/summary.md
            build-mono.log
          if-no-files-found: ignore
